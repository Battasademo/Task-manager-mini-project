<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Task Manager</title>
</head>
<body>
    
    <h1>Task Manager</h1>

    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="What do you need to do?">
        <button type="submit">Add task</button>
    </form>

    <h2>To do</h2>
    <table id="pendingTable">
        <thead>
            <tr><th>Task</th><th class="actions-col">Actions</th></tr>
        </thead>
        <tbody id="pendingList"></tbody>
    </table>

    <h2>Completed</h2>
    <table id="completedTable">
        <thead>
            <tr><th>Task</th><th class="status-col">Status</th><th class="actions-col">Actions</th></tr>
        </thead>
        <tbody id="completedList"></tbody>
    </table>

    <div class="counters">
        <p id="completedCount">Completed: 0</p>
        <p id="remainingCount">Remaining: 0</p>
    </div>

</body>
</html>
